name: FM1 BLE central connection test build
on:
  push:
    branches: [dev/smc-integration]
    paths:
      - '.github/workflows/firmware.yml'
      - 'tools/apply_smc.py'
      - 'smc/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: smc-work
      - uses: actions/checkout@v4
        with:
          repository: w0ts/optimist
          ref: main
          path: optimist
          submodules: false
      - name: Fetch pinned public FM1 base and BSP
        shell: bash
        run: |
          set -euo pipefail
          git -C optimist config -f .gitmodules submodule.fm1base.url https://github.com/w0ts/fm1-base.git
          git -C optimist submodule sync --recursive
          git -C optimist submodule update --init --recursive fm1base
          git -C optimist submodule update --init --recursive third_party/m-flasher third_party/m-bootloader
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup upstream build environment
        working-directory: optimist
        run: python tools/optimist.py setup --yes --no-emu
      - name: Apply guarded SMC MIDI probe 
        run: python smc-work/tools/apply_smc.py optimist 
      - name: Use the compatible Optimist release identity in classic test build
        working-directory: optimist
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("tools/build.py")
          s=p.read_text()
          old='PRODUCT = "FM-1_700"'
          assert s.count(old)==1, "Upstream identity definition changed"
          p.write_text(s.replace(old,'PRODUCT = "FM-1_722"'))
          print("Test identity FM-1_722; unchanged classic firmware build path")
          PY
      - name: Build with BLE central scan and connect enabled
        working-directory: optimist
        run: |
          set -o pipefail
          OPTIMIST_CLASSIC=1 python tools/optimist.py package --profile mots-config --set LAYOUT=0 --set WIFI_LINK=0 --set USB_HOST=0 --set BLE_CENTRAL=1 --set BT_AUDIO=0 --set USB_AUDIO=0 --set ENG_PLAITS=0 --set ENG_STRINGS=0 --set ENG_PHYS=0 --set ENG_CS80=0 --set ENG_PROPHET=0 --set ENG_VPS=0 --set ENG_CZ=0 --set ENG_JUNO=0 --set ENG_ACID=0 --set ENG_NOISE=0 --out dist --summary dist/summary.json 2>&1 | tee ../firmware-build.log
      - name: Reject packages the running FM1 cannot browser-flash
        working-directory: optimist
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,"tools")
          from fm1_install import logical_image, flash_size
          from fm1_route import package_kind, loader_takes, OWN_SLOTS
          packages=list(Path("dist").glob("*.fwsc"))
          if len(packages)!=1: raise SystemExit("Expected exactly one package")
          p=packages[0]
          raw=p.read_bytes()
          size=flash_size(logical_image(raw))
          pkg=package_kind(raw,size)
          allowed,why=loader_takes("optimist",pkg,"FM-1_722")
          print("Package",p.name,"flash size",hex(size),"identity",pkg.product,"type",pkg.kind,"allowed",allowed,why)
          if size != 0x93000 or not allowed or pkg.kind!="optimist":
              raise SystemExit("BLOCKED: package is not Skiff-compatible 0x93000; never publish to web flasher")
          PY
      - name: Verify package and simulate installer paths
        working-directory: optimist
        run: |
          python tests/anyflash_test.py
          # Upstream's full web suite currently has two unrelated recovery-copy assertion failures.
          # The generated site validates the actual FWSC identity, loader marker and image CRC.
          python -m py_compile web/make_site.py
      - name: Generate local package SHA-256 manifest
        working-directory: optimist
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          out = pathlib.Path("dist")
          files = sorted(out.glob("*.fwsc"))
          if len(files) != 1:
              raise SystemExit(f"Expected one FWSC package, found {len(files)}")
          manifest = {"status":"BLE CENTRAL CONNECTION TEST ONLY - NOT HARDWARE VALIDATED",
                      "packages":[{"filename":p.name,"size":p.stat().st_size,
                                   "sha256":hashlib.sha256(p.read_bytes()).hexdigest()} for p in files]}
          (out/"smc-test-manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
          print(json.dumps(manifest,indent=2))
          PY
      - name: Build separate SMC test web flasher
        working-directory: optimist
        run: |
          cat > web/smc-test-flavour.json <<'JSON'
          {"flavours":[{"id":"smc-ble-test","title":"SMC-Mixer Bluetooth connection test","description":"Experimental BLE discovery/connection only. No SMC fader or transport control. Three optional sound engines disabled. Back up Skiff first.","profile":"mots-config","file":"dist/*.fwsc"}]}
          JSON
          python - <<'PY'
          from pathlib import Path
          p=Path("web/installer/installer.js")
          src=p.read_text()
          changes={
            'el.bootOpt.hidden = st.bootWord === "mboot";':'el.bootOpt.hidden = true; /* SMC test: no bootloader replacement UI */',
            'const boot = bootloaderChoice(pkg.bootloader, el.boot.checked).choice;':'const boot = "keep"; /* SMC test: always preserve the existing bootloader */',
            'const keep = route.wantsMboot ? h("button.o-btn.sm.oi-keepboot", { type: "button", onclick: () => { el.boot.checked = false; render(); install(); } }, TEXT.keepBoot) : null;':'const keep = null; /* SMC test: never offer m-bootloader */',
          }
          for old,new in changes.items():
              if src.count(old)!=1: raise SystemExit("Installer changed: cannot safely lock bootloader: "+old)
              src=src.replace(old,new)
          # Remove the option's DOM as well, rather than merely hiding it.
          src=src.replace('el.bootRow = h("div.oi-bootrow", {}, el.bootLine, el.bootOpt);',
                          'el.bootRow = h("div.oi-bootrow", {}, el.bootLine);')
          if 'el.bootRow = h("div.oi-bootrow", {}, el.bootLine);' not in src:
              raise SystemExit("Could not remove bootloader checkbox")
          p.write_text(src)
          print("SMC installer: bootloader hard-locked to keep, checkbox removed")
          PY
          python web/make_site.py --flavours web/smc-test-flavour.json 0.1 ../smc-flasher-site
          python - <<'PY'
          import json
          from pathlib import Path
          site=Path("../smc-flasher-site/webapp/installer")
          page=site/"index.html"
          html=page.read_text()
          # Optimist only offers packages with a non-empty release in the installer.
          old='"release": ""'
          new='"release": "SMC-BLE-TEST"'
          if html.count(old)!=1:
              raise SystemExit(f"Expected exactly one embedded test package; found {html.count(old)}")
          page.write_text(html.replace(old,new))
          manifest=site/"site.json"
          data=json.loads(manifest.read_text())
          if len(data.get("packages",[]))!=1:
              raise SystemExit("Expected exactly one bundled firmware package")
          data["packages"][0]["release"]="SMC-BLE-TEST"
          manifest.write_text(json.dumps(data,indent=2)+"\\n")
          assert "SMC-BLE-TEST" in page.read_text()
          assert (site/("../../firmware/"+Path(data["packages"][0]["pkg"]).name)).resolve().is_file()
          print("Bundled SMC firmware now appears as an installable release")
          PY
          python - <<'PY'
          from pathlib import Path
          p=Path("../smc-flasher-site/index.html")
          p.write_text("""<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FM1 SMC Bluetooth Test Flasher</title><style>body{background:#10141a;color:#e6eaf0;font:16px system-ui;max-width:680px;margin:8vh auto;padding:24px}a{color:#7dcaff}.card{border:1px solid #394450;border-radius:16px;padding:25px}h1{font-size:26px}.warn{color:#ffca85}a.go{display:inline-block;background:#b8e2ff;color:#10141a;padding:12px 18px;border-radius:9px;text-decoration:none;font-weight:700}</style><div class="card"><h1>FM1 / SMC-Mixer Bluetooth test</h1><p>Separate experimental installer with the exact test firmware included. No file download or upload needed.</p><p class="warn">Back up your Skiff projects before flashing. This build is not yet hardware validated and does not control SMC faders.</p><p>Only use Chrome or Edge with a USB data cable. Read the installer's compatibility warning before proceeding. Never force a bootloader change.</p><p><a class="go" href="webapp/installer/">Open Bluetooth test installer</a></p><p><a href="firmware/">Firmware files</a> &middot; <a href="https://github.com/alfonsogordon/optimist-SMC/blob/dev/smc-integration/SMC-TEST-SAFETY.md">Safety checklist</a></p></div></html>""")
          PY
      - name: Upload standalone flasher site
        uses: actions/upload-artifact@v4
        with:
          name: smc-bluetooth-web-flasher-site
          path: smc-flasher-site/
          if-no-files-found: error
          retention-days: 7
      - name: Upload site for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: smc-flasher-site/
      - name: Save build log even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm1-build-diagnostics
          path: firmware-build.log
          retention-days: 7
      - name: Save BLE central test artifact (NOT SMC control firmware)
        uses: actions/upload-artifact@v4
        with:
          name: fm1-ble-central-test-not-smc-control
          path: optimist/dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: firmware
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy independent SMC flasher
        id: deployment
        uses: actions/deploy-pages@v4
